name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Shotora.sln -c Release
      - name: Test
        # Avalonia UI tests share one dispatcher thread; run test collections serially.
        run: dotnet test Shotora.App.Tests -c Release --no-build -- xUnit.ParallelizeTestCollections=false
